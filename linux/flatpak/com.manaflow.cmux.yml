# Flatpak manifest for the cmux Linux port — ROUND 1 (scoping): VTE-only,
# dev-profile permissions, network during build. Deviations from Flathub
# rules are marked DEV-ONLY and mapped to later rounds in
# docs/linux-port/features/15-flatpak-packaging.md (the harness contract
# lives there too — keep the two in sync).
#
# Build with: linux/scripts/flatpak-build.sh build
app-id: com.manaflow.cmux
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.swift6
command: cmux-adw

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # venus (virtio-GPU) Vulkan fences hang GTK teardown in VMs — verified
  # 2026-08-20 (PROGRESS). GL-only is the safe default on every host.
  - --env=GDK_DISABLE=vulkan
  # Swift runtime libs are bundled into /app/lib (the SDK extension is
  # build-time only; the Platform runtime ships no Swift).
  - --env=LD_LIBRARY_PATH=/app/lib
  # Own GApplication id, ALWAYS. The locally-built daily owns
  # com.manaflow.cmux on the session bus; sharing it makes a flatpak
  # launch forward activation to the daily and exit without a word (and
  # it is what made the desktop entry useless before). Matches the
  # exported com.manaflow.cmux.flatpak.desktop, so GNOME can route
  # notifications to it.
  - --env=CMUX_APP_ID=com.manaflow.cmux.flatpak
  # Ghostty shell-integration + themes (round 3): the app's self-locate
  # walks the repo tree, which does not exist inside the sandbox.
  - --env=GHOSTTY_RESOURCES_DIR=/app/share/ghostty
  # Round 2: pane shells run on the HOST via the org.freedesktop.Flatpak
  # portal (flatpak-spawn --host). This is what makes panes a real dev
  # environment; CMUX_FLATPAK_HOST_SHELL=0 falls back to sandbox shells.
  - --talk-name=org.freedesktop.Flatpak
  # DEV-ONLY breadth: narrowing is a round-3 item now that shells run on
  # the host (the app itself needs far less than `home`).
  - --share=network
  - --filesystem=home

build-options:
  append-path: /usr/lib/sdk/swift6/bin
  prepend-ld-library-path: /usr/lib/sdk/swift6/lib

modules:
  - name: vte-gtk4
    buildsystem: meson
    config-opts:
      - -Dgtk4=true
      - -Dgtk3=false
      - -Dvapi=false
      - -Dgir=false
      - -Ddocs=false
    sources:
      - type: archive
        # Pin = the version validated on Fedora 43 + the x12vm toolbox
        # deployment (2026-08-20). GNOME 49 series.
        url: https://download.gnome.org/sources/vte/0.82/vte-0.82.3.tar.xz
        sha256: 6dc6278f6fee30d07d1a03e2ba3335b1ea4e8d2956ceb59d861943115d930a85

  # Ghostty's GTK runtime links layer-shell; the GNOME runtime has no
  # such library, so it is built here.
  - name: gtk4-layer-shell
    buildsystem: meson
    config-opts:
      - -Dexamples=false
      - -Ddocs=false
      - -Dtests=false
    sources:
      - type: archive
        url: https://github.com/wmww/gtk4-layer-shell/archive/refs/tags/v1.3.0.tar.gz
        sha256: 1ebb01ab14e98afd1727f68f64981c37bd23305b1f131f5667c02b94cf593192

  # The embedding shim, built FROM SOURCE inside the sandbox — a
  # host-built libghostty-gtk.so cannot be copied in: the runtime's
  # glibc is older than Fedora's, so the copy trick that works for a
  # same-distro toolbox (2026-08-20 VM deployment) does not apply here.
  # Zig is a self-contained tarball, pinned by sha256.
  - name: ghostty-shim
    buildsystem: simple
    build-options:
      build-args:
        # Belt only since round 4: zig's deps are VENDORED (the
        # zig-global-cache dir source below, seeded by the driver's
        # zig_deps_cache with --fetch=all — bare --fetch skips lazy
        # deps). The sandbox's ephemeral home means a host zig cache is
        # never visible in here, and zig's own HTTP client fails
        # in-sandbox where git/curl work — measured 2026-09-04.
        - --share=network
    build-commands:
      - install -d /app/lib /app/include /app/share
      # NO -Doptimize: the recipe validated on the host (linux/README.md,
      # GHOSTTY-SHIM.md) is the default Debug build. A ReleaseFast shim
      # SIGSEGV'd inside ghostty_embed_init on first launch (2026-08-20),
      # which is what Zig's disabled safety checks buy you on an
      # unvalidated configuration. Optimize later, with evidence.
      # -Dflatpak=true turns on Ghostty's OWN FlatpakHostCommand path
      # (src/termio/Exec.zig), so its shells run on the host through the
      # portal. Without it, Ghostty panes are SANDBOX shells; and our own
      # flatpak-spawn wrapper cannot substitute for it — see the Ghostty
      # note in features/15.
      - ZIG_GLOBAL_CACHE_DIR="$PWD/zig-global-cache"
        ./zig-x86_64-linux-0.15.2/zig build lib-gtk -Dapp-runtime=gtk
        -Dflatpak=true -Dversion-string=1.3.0-dev
      - install -Dm755 zig-out/lib/libghostty-gtk.so /app/lib/libghostty-gtk.so
      - cp -a zig-out/include/. /app/include/
      - cp -a zig-out/share/ghostty /app/share/ghostty
    sources:
      - type: archive
        url: https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
        sha256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
        strip-components: 0
      # Vendored zig package cache (driver: zig_deps_cache). Read-only
      # input; the build command points ZIG_GLOBAL_CACHE_DIR at it.
      - type: dir
        path: ../.flatpak-deps-cache/zig-global
        dest: zig-global-cache
      - type: dir
        path: ../../ghostty
        skip:
          - .git
          - .zig-cache
          - zig-out
          # Side-prefix builds used to test a new shim WITHOUT touching the
          # canonical zig-out that a running instance has mapped (2026-09-01).
          # Never build inputs — skipping keeps the context lean and the
          # sandbox build deterministic.
          - zig-out-dev

  - name: cmux-adw
    buildsystem: simple
    build-options:
      build-args:
        # DEV-ONLY: SwiftPM fetches adwaita-swift etc. at build time.
        # Round 3 pregenerates offline sources for Flathub compliance.
        - --share=network
      env:
        # Link the shim installed by the ghostty-shim module above
        # (Package.swift auto-detects, this points it at /app).
        CMUX_GHOSTTY: '1'
        CMUX_GHOSTTY_OUT: /app
    build-commands:
      # Debug configuration on purpose: it is the configuration every
      # host/VM deployment has validated. Release is a later round with
      # its own verification pass.
      #
      # Dependency git traffic is fully LOCAL: .flatpak-deps-cache holds
      # bare-repo mirrors seeded from the host's linux/.build/repositories
      # (driver `deps-cache` refreshes them), and set-mirror redirects
      # every original URL to them — including the branch-update fetch
      # SwiftPM insists on (aparoksha.dev 504s killed three builds on
      # 2026-08-20). Mirrors ONLY — combining them with --cache-path made
      # SwiftPM collide with itself ("already exists unexpectedly") and
      # misread swift-crypto's tags. Both .git/non-.git URL spellings are
      # registered since manifests and remotes disagree on the suffix.
      # This is the round-3 offline story, landed early.
      # Defensive: whatever the dir-source copy carried in (skip-list
      # semantics proved unreliable — "already exists unexpectedly"
      # collisions from inherited build state killed two resolves),
      # the app build starts from clean SwiftPM state. The probe echo
      # records whether the copy actually contained .build.
      - 'cd linux && if [ -d .build ]; then echo "PROBE: copy HAS .build"; else echo "PROBE: copy has no .build"; fi && rm -rf .build .swiftpm'
      - |
        cd linux && for r in .flatpak-deps-cache/repositories/*/; do
          url=$(git -C "$r" config remote.origin.url 2>/dev/null) || continue
          swift package config set-mirror --original "$url" --mirror "file://$PWD/${r%/}"
          case "$url" in
            *.git) swift package config set-mirror --original "${url%.git}" --mirror "file://$PWD/${r%/}" ;;
            *)     swift package config set-mirror --original "$url.git"    --mirror "file://$PWD/${r%/}" ;;
          esac
        done
      - cd linux && swift build --product cmux-adw
      - cd linux && swift build --product cmux
      - install -Dm755 linux/.build/debug/cmux-adw /app/bin/cmux-adw
      - install -Dm755 linux/.build/debug/cmux /app/bin/cmux
      - mkdir -p /app/lib && cp -a /usr/lib/sdk/swift6/lib/swift/linux/*.so* /app/lib/
      - install -Dm644 linux/flatpak/com.manaflow.cmux.flatpak.desktop /app/share/applications/com.manaflow.cmux.flatpak.desktop
      # Ship the cmux skills so a flatpak-only install is self-contained
      # (no repo checkout). Host-side agents reach them through the
      # flatpak's own files dir; `install-user-skills.sh` links them.
      - install -d /app/share/cmux && cp -a skills /app/share/cmux/skills
      # Ship the linker too, or a flatpak-only machine gets skills with no
      # supported way to wire them up:
      #   flatpak run --command=install-user-skills.sh com.manaflow.cmux
      # It links ~/.claude/skills at the HOST-visible flatpak path (not
      # /app, which pane shells cannot see).
      - install -Dm755 linux/scripts/install-user-skills.sh /app/bin/install-user-skills.sh
      # ...and the host-CLI installer: pane shells run on the HOST and
      # cannot see /app/bin/cmux, so a flatpak-only machine has no `cmux`
      # command until this writes the wrapper (2026-08-21).
      - install -Dm755 linux/scripts/install-host-cli.sh /app/bin/install-host-cli.sh
      # opencode's hook plugin: `cmux hooks setup` reads it to install the
      # opencode integration, and aborted without it on a flatpak-only
      # machine. Lives in share/cmux, which the CLI now searches relative
      # to its own binary.
      - install -Dm644 Resources/opencode-plugin.js /app/share/cmux/opencode-plugin.js
      # Build stamp (written by the driver, which has git; the source copy
      # skips .git). Served as `system.build` so any machine can say what
      # it is running.
      - install -Dm644 linux/flatpak/build-info.json /app/share/cmux/build-info.json
    sources:
      # SCOPED on purpose. A whole-repo `type: dir` copied 551 MB into
      # the build context every run — including ~29 MB of conversation
      # exports (*.txt), .claude/settings.local.json, and the iOS/macOS
      # app trees the Linux build never touches. None of it ever shipped
      # (only /app is exported), but personal files have no business in a
      # build context. These three subtrees are exactly what
      # linux/Package.swift needs, plus the skills we install.
      - type: dir
        path: ../../linux
        dest: linux
        skip:
          - .build
          - .build-gnome50
          - .flatpak-build
      - type: dir
        path: ../../Packages
        dest: Packages
      - type: dir
        path: ../../skills
        dest: skills
      # linux/Sources/CmuxCLI is a nest of SYMLINKS into the repo root —
      # CLI/ and Sources/ hold code shared with the macOS app (CLAUDE.md:
      # "changes to shared sources must keep building on macOS"). Omit
      # them and the copy has dangling links, which SwiftPM reports as
      # the wonderfully indirect "target 'CmuxCLI' ... is empty".
      - type: dir
        path: ../../CLI
        dest: CLI
      - type: dir
        path: ../../Sources
        dest: Sources
      # Just the one asset from Resources/ — the rest is the macOS app.
      - type: file
        path: ../../Resources/opencode-plugin.js
        dest: Resources
        dest-filename: opencode-plugin.js
